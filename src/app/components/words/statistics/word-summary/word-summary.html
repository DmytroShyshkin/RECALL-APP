<div class="stat-row">
    <div class="stat-tile">
        <span class="stat-value">{{ userStatsSummary?.currentStreak ?? '—' }}</span>
        <span class="stat-label">Current Streak</span>
    </div>
    <div class="stat-tile">
        <span class="stat-value">{{ userStatsSummary?.totalWordsLearned ?? '—' }}</span>
        <span class="stat-label">Words Learned</span>
    </div>
    <div class="stat-tile">
        <span class="stat-value">{{ userStatsSummary?.totalReviews ?? '—' }}</span>
        <span class="stat-label">Total Reviews</span>
    </div>
</div>
