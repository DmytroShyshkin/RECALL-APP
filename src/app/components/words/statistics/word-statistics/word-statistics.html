<div class="wordStatisticsContainer">
    <h1>Word Statistics</h1>
    <section class="wordStatistics">
        <div class="statGrid">
            @for (item of wordStatistics; track item.wordId) {
            <div class="statInfo">
                <p><b>Word</b>: {{ item.wordId }}</p>
                <p><b>Total Reviews</b>: {{ item.totalReviews }}</p>
                <p><b>Correct Reviews</b>: {{ item.correctReviews }}</p>
                <p><b>Lapses</b>: {{ item.lapses }}</p>
                <p><b>Last Reviewed</b>: {{ item.lastReviewedAt }}</p>
            </div>
            }
        </div>
    </section>
</div>
