<header class="site-header">
    <nav class="site-nav">
        <h1 class="site-title" (click)="goToHome()">RECALL <span class="site-subtitle">Enables Contextual And Language Learning</span></h1>
    </nav>


    <nav class="header-actions">
        @if (isLoggedIn$ | async) {
        <button class="btn btn-profile" (click)="toggleDropdown()">My Account ▾</button>

        @if (dropdownOpen) {
        <menu class="dropdown dropdown-account">
            <button routerLink="/profile" class="btn btn-primary" (click)="closeDropdown()">Profile</button>
            <button routerLink="/settings" class="btn btn-primary" (click)="closeDropdown()">Settings</button>
            <button class="btn btn-secondary" (click)="logout()">Logout</button>
        </menu>
        }
        } @else {
        <button class="btn btn-primary" (click)="toggleDropdown()">Login / Register</button>
        @if (dropdownOpen) {
        <menu class="dropdown login/register">
            <button class="btn btn-secondary" (click)="goToLogin(); closeDropdown()">Login</button>
            <button class="btn btn-secondary" (click)="goToRegister(); closeDropdown()">Register</button>
        </menu>
        }
        }
        <button class="btn btn-primary">Download</button>
    </nav>
</header>
